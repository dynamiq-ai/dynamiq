connections:
  openai-conn:
    type: dynamiq.connections.OpenAI
    api_key: ${oc.env:OPENAI_API_KEY}

nodes:
  luna-auto:
    type: dynamiq.nodes.agents.Agent
    name: Luna auto
    role: "a concise, helpful assistant"
    max_loops: 3
    llm:
      id: luna-auto-llm
      type: dynamiq.nodes.llms.OpenAI
      name: OpenAI-Luna-auto
      model: gpt-6-luna
      connection: openai-conn
      max_tokens: 4000
      reasoning_effort: auto
      verbosity: medium
      strict_tools: false
      error_handling:
        timeout_seconds: 120
        retry_interval_seconds: 1
        max_retries: 1
      caching:
        enabled: false
    input_transformer:
      selector:
        input: "$.input"
    output_transformer:
      selector:
        answer: "$.content"

