connections:
  openai-conn:
    type: dynamiq.connections.OpenAI
  aws-conn:
    type: dynamiq.connections.AWS
    region: ${oc.env:AWS_DEFAULT_REGION}

nodes:
  sandbox-agent:
    type: dynamiq.nodes.agents.Agent
    llm:
      id: sandbox-agent-llm
      type: dynamiq.nodes.llms.OpenAI
      connection: openai-conn
      model: gpt-4o
    role: "a helpful assistant that can execute shell commands in a sandbox environment."
    sandbox:
      enabled: true
      backend:
        type: dynamiq.sandboxes.BedrockAgentCoreSandbox
        connection: aws-conn
        # Workspace-relative, unlike E2B's absolute /home/user.
        base_path: workspace
    max_loops: 15
    inference_mode: XML
    summarization_config:
      enabled: true

flows:
  sandbox-agent-flow:
    name: Sandbox Agent Flow
    nodes:
      - sandbox-agent

workflows:
  sandbox-agent-workflow:
    flow: sandbox-agent-flow
    version: 1
