[project]
name = "dynamiq"
version = "0.69.0"
description = "Dynamiq is an orchestration framework for agentic AI and LLM applications"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [
    { name = "Dynamiq Team", email = "hello@getdynamiq.ai" },
]
keywords = ["ai", "gpt", "agents", "rag", "llm", "generative-ai", "llmops"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jinja2>=3.1.6,<3.2.0",
    "pydantic>=2.12.5,<2.13.0",
    "openai>=1.83.0",
    "boto3>=1.43.32,<2.0.0",
    "redis>=5.0.0,<5.1.0",
    "litellm==1.103.1",
    "requests>=2.32.5,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "click>=8.1.0,<9.0.0",
    "google-auth>=2.40.0,<3.0.0",
    "RestrictedPython>=8.4,<8.5.0",
    "jsonpath-ng>=1.6.1,<1.7.0",
    "jsonpickle>=3.0.3,<3.1.0",
    "omegaconf>=2.3.0,<2.4.0",
    "filetype>=1.2.0,<1.3.0",
    "more-itertools>=10.3.0,<10.4.0",
    "pypdf>=6.20.1,<7.0.0",
    "pillow>=12.3.0,<14.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "lxml>=6.1.0,<7.0.0",
    "numpy>=2.2.6,<3.0.0 ; python_version < '3.11'",
    "numpy>=2.3.2,<3.0.0 ; python_version >= '3.11'",
    "mcp>=1.23.0,<2.0.0",
    "orjson>=3.11.6,<4.0.0",
    "charset-normalizer>=3.4.2,<4.0.0",
    "tenacity==9.1.2",
    "regex>=2025.9.18,<2026.0.0",
    # Imported directly by ExcelToList and the file tools; also what seaborn and databricks-sql-connector bring in.
    "pandas>=2.2.3,<4.0.0",
    # DataFrame.to_markdown needs it, for the spreadsheet previews of the file tools.
    "tabulate>=0.9.0,<1.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pyyaml==6.0.3",
    "tiktoken==0.12.0",
    "neo4j>=6.0.3,<7.0.0",
    "typing-extensions>=4.12.2",
    "exceptiongroup>=1.2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
# HTML and Markdown transformers, Markdown to PDF, PDF page images, the HTML header splitter and the Unstructured
# converter, plus pdfplumber for the Python tools.
files = [
    "beautifulsoup4>=4.12.3,<5.0.0",
    "inscriptis>=2.5.0,<3.0.0",
    "markdown>=3.8.1,<4.0.0",
    "pdf2image>=1.17.0,<1.18.0",
    "pdfplumber>=0.11.8,<0.12.0",
    "reportlab>=4.3.0,<5.0.0",
    "unstructured-client>=0.42.3,<0.43.0",
]
# Plotting for the Python tools.
data = [
    "matplotlib>=3.10.7,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
]
vectorstores = [
    "chromadb-client>=1.5.0,<2.0.0",
    "elasticsearch>=8.12.0,<8.13.0",
    "opensearch-py>=3.0.0,<4.0.0",
    "pgvector>=0.3.6,<0.4.0",
    "pinecone-client>=3.2.2,<3.3.0",
    "pymilvus[milvus-lite]>=2.6.0,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "qdrant-client>=1.14.3,<1.20.0",
    "requests-aws4auth>=1.3.1,<2.0.0",
    "turbopuffer>=2.10.2,<2.11.0",
    "weaviate-client>=4.22.0,<4.23.0",
]
sql = [
    "databricks-sql-connector>=4.4.0,<4.6.0",
    "mysql-connector-python>=9.1.0,<9.2.0",
    "pyOpenSSL>=26.0.0,<27.0.0",
    "snowflake-connector-python>=4.7.1,<5.0.0",
]
browser = [
    "browserbase>=1.15.0,<2.0.0",
    "playwright>=1.50.0,<2.0.0",
    "stagehand>=3.22.0,<4.0.0",
    "steel-sdk==0.15.0",
]
sandboxes = [
    "daytona>=0.161.0,<0.162.0",
    "e2b>=2.26.0,<3.0.0",
    "e2b-code-interpreter>=2.8.1,<3.0.0",
    "e2b-desktop>=2.2.0,<3.0.0",
]
# Vertex AI RAG search and the Document AI converter. Vertex AI and Gemini models need only the core install.
gcp = [
    "google-cloud-aiplatform>=1.133.0,<2.0.0",
    "google-cloud-documentai>=3.15.0,<4.0.0",
]
evals = [
    "rapidfuzz>=3.14.0,<3.15.0",
    "rouge-score>=0.1.2,<0.2.0",
    "sacrebleu>=2.5.1,<2.6.0",
]
cua = ["cua-computer==0.4.19 ; python_version >= '3.12' and python_version < '3.14'"]
monty = ["pydantic-monty>=0.0.16,<0.0.17"]
# Every extra except cua and monty, which stay opt-in.
all = ["dynamiq[files,data,vectorstores,sql,browser,sandboxes,gcp,evals]"]

[project.scripts]
dynamiq = "dynamiq.cli:main"

[project.urls]
homepage = "https://www.getdynamiq.ai"
repository = "https://github.com/dynamiq-ai/dynamiq"
documentation = "https://dynamiq-ai.github.io/dynamiq"

[dependency-groups]
dev = [
    "setuptools>=83.0.0,<83.1.0",
    "pre-commit>=3.7.0,<3.8.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3.14.0,<3.15.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "coverage>=7.10.0,<8.0.0",
    "fakeredis>=2.21.3,<2.22.0",
    "mkdocs>=1.6.0,<1.7.0",
    "mkdocs-material>=9.7.0,<9.8.0",
    "mkdocstrings>=0.25.1,<0.26.0",
    "mkdocstrings-python>=1.10.4,<1.11.0",
    "mkdocs-autorefs<1.4.0",
    "griffe<2.0.0",
    "requests-mock>=1.12.1,<1.13.0",
    "pytest-rerunfailures>=16.1,<17.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]
examples = [
    "fastapi>=0.133.0,<0.134.0",
    "uvicorn>=0.35.0,<0.36.0",
    "websockets>=15.0.0,<15.1.0",
    "sse-starlette>=2.1.0,<2.2.0",
    "httpx>=0.28.0,<0.29.0",
    "httpx-sse>=0.4.0,<0.5.0",
    "chainlit>=2.9.4,<3.0.0",
    "typer>=0.12.3,<0.13.0",
    "streamlit>=1.54.0,<2.0.0",
    "streamlit-date-picker>=0.0.3,<0.1.0",
    "streamlit-image-select>=0.6.0,<0.7.0",
    "streamlit-pdf-viewer>=0.0.14,<0.1.0",
    "weasyprint>=70.0,<71.0",
    "selenium>=4.21.0,<4.22.0",
    "tqdm>=4.66.4,<4.67.0",
    "sympy>=1.13.1,<1.14.0",
    "pygraphviz>=1.14,<1.15.0",
    "agentops>=0.3.12,<0.4.0",
    "langfuse>=2.51.2,<3.0.0",
    "peft>=0.13.0,<0.14.0",
    "pyarrow>=23.0.1,<24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynamiq"]

[tool.uv]
exclude-newer = "7 days"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.isort]
line_length = 120

[tool.pytest.ini_options]
markers = [
    "smoke: slow, paid end-to-end production-scenario tests; run only via the `run-smoke-tests` label / `make test-smoke`",
    "integration: tests that exercise real integrations (may require credentials)",
    "unit: fast, isolated unit tests",
]
