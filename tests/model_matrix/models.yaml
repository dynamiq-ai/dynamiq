# Models the matrix runs, as OpenRouter names them. Ids and capabilities were checked against
# https://openrouter.ai/api/v1/models on 2026-11-06; a model whose id disappears is skipped, not failed.
#   parallel:  OpenRouter lists parallel_tool_calls for it, so the parallel scenario runs.
#   reasoning: it reasons before answering, so it gets a larger output budget.
# Prices are OpenRouter's, in USD per million input/output tokens.
