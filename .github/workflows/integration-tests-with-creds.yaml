name: Integration Tests With Creds

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  integration-tests-with-creds:
    name: Integration Tests With Creds
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-integration-tests-with-creds' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Started first so that Neo4j downloads and boots while the dependencies install.
      - name: Start Neo4j
        env:
          NEO4J_VERSION: 5.26.32
          NEO4J_SHA256: d279ae6a9b38034280681a558b0cd222dce89f87cc3d9867f1f7bd28ef5ebc30
        run: |
          archive="$RUNNER_TEMP/neo4j.tar.gz"
          curl -fsSL -o "$archive" "https://dist.neo4j.org/neo4j-community-$NEO4J_VERSION-unix.tar.gz"
          echo "$NEO4J_SHA256  $archive" | sha256sum --check --quiet
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          neo4j_home="$RUNNER_TEMP/neo4j-community-$NEO4J_VERSION"
          "$neo4j_home/bin/neo4j-admin" dbms set-initial-password testpassword
          "$neo4j_home/bin/neo4j" start
          echo "NEO4J_HOME=$neo4j_home" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.24"

      - name: Install dependencies
        run: uv sync --frozen --extra all

      - name: Wait for Neo4j
        timeout-minutes: 2
        run: until "$NEO4J_HOME/bin/cypher-shell" -u neo4j -p testpassword 'RETURN 1' > /dev/null 2>&1; do sleep 2; done

      - name: Run integration tests with creds
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 8
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSTRUCTURED_API_KEY: ${{ secrets.UNSTRUCTURED_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          # Opt-in for the live Bedrock AgentCore tests; empty (unset secret) keeps them skipped.
          BEDROCK_AGENTCORE_TESTS: ${{ secrets.BEDROCK_AGENTCORE_TESTS }}
          # A networkMode=PUBLIC interpreter id; only needed for the package-installation test,
          # which skips when unset because the built-in interpreter has no network egress.
          BEDROCK_AGENTCORE_INTERPRETER_ID: ${{ secrets.BEDROCK_AGENTCORE_INTERPRETER_ID }}
        run: make test-integration-with-creds
