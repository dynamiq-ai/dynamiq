name: Integration Tests With Creds

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  integration-tests-with-creds:
    name: Integration Tests With Creds
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-integration-tests-with-creds' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Loading the test image back into the daemon costs ~90s of tarball export/import against the
      # legacy overlay2 store. The containerd store takes the layers directly. Must precede buildx,
      # since restarting the daemon would kill the builder container.
      - name: Enable the containerd image store
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          envkey_UNSTRUCTURED_API_KEY: ${{ secrets.UNSTRUCTURED_API_KEY }}
          envkey_PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          envkey_PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          envkey_PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          envkey_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          envkey_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          envkey_QDRANT_URL: ${{ secrets.QDRANT_URL }}
          envkey_QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          envkey_EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          envkey_E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          envkey_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          envkey_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          envkey_AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          # Opt-in for the live Bedrock AgentCore tests; empty (unset secret) keeps them skipped.
          envkey_BEDROCK_AGENTCORE_TESTS: ${{ secrets.BEDROCK_AGENTCORE_TESTS }}
          # A networkMode=PUBLIC interpreter id; only needed for the package-installation test,
          # which skips when unset because the built-in interpreter has no network egress.
          envkey_BEDROCK_AGENTCORE_INTERPRETER_ID: ${{ secrets.BEDROCK_AGENTCORE_INTERPRETER_ID }}

      # Started before the image load so Neo4j's pull and startup overlap with it instead of sitting
      # on the critical path; by the time the test container starts it is already healthy.
      - name: Start Neo4j
        run: docker compose up -d neo4j

      - name: Load Test Image
        uses: docker/bake-action@v5
        with:
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          targets: dynamiq-app-test

      - name: Run integration tests with creds
        run: docker compose up dynamiq-app-test-integration-with-creds --exit-code-from dynamiq-app-test-integration-with-creds
