name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env file on push or internal PR
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SpicyPizza/create-envfile@v2
        with:
          envkey_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          envkey_UNSTRUCTURED_API_KEY: ${{ secrets.UNSTRUCTURED_API_KEY }}
          envkey_PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          envkey_PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          envkey_PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          envkey_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          envkey_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          envkey_QDRANT_URL: ${{ secrets.QDRANT_URL }}
          envkey_QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      - name: Create .env file on fork PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: SpicyPizza/create-envfile@v2

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          targets: dynamiq-app

  # The jobs above build the image on the Dockerfile's default Python (3.13). This builds it on 3.14 too, so the
  # PYTHON_VERSION build argument is exercised there. Its own cache scope keeps it from evicting the 3.13 layers.
  build-python-3-14:
    name: build (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker-compose.yaml names .env as an env_file, so bake needs the file to exist; building needs no secrets.
      - name: Create an empty .env file
        run: touch .env

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          set: |
            *.args.PYTHON_VERSION=3.14.8
            *.cache-from=type=gha,scope=python-3.14
            *.cache-to=type=gha,mode=max,scope=python-3.14
          targets: dynamiq-app

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure --color always
        env:
          SKIP: 'no-commit-to-branch'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Loading the test image back into the daemon costs ~50s of tarball export/import against the
      # legacy overlay2 store. The containerd store takes the layers directly. Must precede buildx,
      # since restarting the daemon would kill the builder container.
      - name: Enable the containerd image store
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env file on push or internal PR
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SpicyPizza/create-envfile@v2
        with:
          envkey_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          envkey_UNSTRUCTURED_API_KEY: ${{ secrets.UNSTRUCTURED_API_KEY }}
          envkey_PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          envkey_PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          envkey_PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          envkey_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          envkey_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          envkey_QDRANT_URL: ${{ secrets.QDRANT_URL }}
          envkey_QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          envkey_E2B_API_KEY: ${{ secrets.E2B_API_KEY }}

      - name: Create .env file on fork PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: SpicyPizza/create-envfile@v2

      - name: Load Image
        uses: docker/bake-action@v7
        with:
          source: .
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          targets: dynamiq-app-test

      - name: Run tests on push to main
        if: ${{ github.event_name == 'push' }}
        run: docker compose up dynamiq-app-test-cov --exit-code-from dynamiq-app-test-cov

      - name: Run tests on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: docker compose up dynamiq-app-test-cov-exclude-integration-with-creds --exit-code-from dynamiq-app-test-cov-exclude-integration-with-creds

      - uses: actions/upload-artifact@v7
        with:
          name: coverage_report
          path: ./reports

  coverage:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage_report
          path: reports

      - name: Produce the coverage report on push or internal PR
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: ./reports/coverage.xml
          junitxml-path: ./reports/test-results.xml
          report-only-changed-files: true
          xml-skip-covered: true
          remove-links-to-lines: true

  # The test job runs the suite in the Docker image, on the image's Python (3.13), and reports coverage. This runs the
  # same tests, minus the ones needing credentials, on every other supported Python.
  test-python-versions:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    env:
      # Wins over the repository's .python-version (3.13) for every uv command below.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.24"

      - name: Install dependencies
        run: uv sync --frozen --extra all

      - name: Run tests
        run: uv run --frozen pytest tests --ignore=tests/integration_with_creds -m "not smoke" -n auto --dist worksteal

  # The other test jobs install all the extras. This one installs the default dependencies only, so a module that the
  # default install imports cannot come to depend on an extra, and the file tools that agents add work without extras.
  test-default-install:
    name: test (default install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.24"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: >-
          uv run --frozen pytest tests/unit/utils/test_lazy_imports.py tests/unit/test_lazy_loading.py
          tests/unit/nodes/tools/test_file_tools.py

  build-mkdocs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.24"

      - name: Install dependencies
        run: make install-dependencies-dev

      - name: Build MkDocs
        run: make build-mkdocs

  publish-updated-mkdocs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-mkdocs
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.24"

      - name: Install dependencies
        run: make install-dependencies-dev

      - name: Publish Updated MkDocs
        run: make publish-mkdocs
